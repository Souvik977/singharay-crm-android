
workflows:
  android-workflow:
    name: Singharay CRM Android
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          cd Singharay_CRM_Android_WebView_Project
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - Singharay_CRM_Android_WebView_Project/app/build/outputs/apk/debug/*.apk
